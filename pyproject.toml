[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micelia"
version = "0.1.0"
description = "Micelia — Orquestador central del ecosistema UTOP.IA"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.fsl", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "UTOP.IA Team" }
]
keywords = [
    "longevity",
    "biohacking",
    "ai",
    "education",
    "cybersecurity",
    "health",
    "cooperative",
    "micelia"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "lancedb>=0.4.0",

    # Validation & Config
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # AI/ML
    # NOTE: torch removed — it is not imported anywhere in micelia (gateway uses
    # Ollama/onnxruntime for any ML). On linux/arm64 it pulled the multi-GB NVIDIA
    # CUDA wheels into the image, which are useless here. Re-add as a CPU-only extra
    # (pip install torch --index-url https://download.pytorch.org/whl/cpu) only if
    # a real torch dependency is introduced.
    "onnxruntime>=1.16.0",

    # Utilities
    "loguru>=0.7.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "prometheus-client>=0.19.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Tunnel
    "pyngrok>=7.0.0",

    # Google Calendar
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.100.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.12.0",
    "coverage[toml]>=7.5",
    "httpx>=0.26.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.20.0",
    "ruff>=0.1.0",
]

[project.scripts]
micelia = "app.cli:main"
idm = "app.cli:_main_deprecated"  # deprecated alias, removible en v0.2

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib evita el colapso de namespace cuando hay varios directorios `tests/`
# distribuidos (raíz y sdk/python/tests/). Sin esto, pytest los fusiona como
# un único paquete `tests` y falla con ModuleNotFoundError al colectar.
addopts = "--import-mode=importlib"
